# Docker setup for CDK Trenggalek (replaces Laradock).
#
# The database is NOT part of this stack. It runs in the shared MySQL stack
# (/opt/mysql on the VPS) and is reached over the external "db_net" network.
#
# Variables are read from the project's .env (Laravel's). When running inside Docker:
#   DB_HOST=mysql        (container name of the shared MySQL)
#   DB_PORT=3306
#   DB_DATABASE / DB_USERNAME / DB_PASSWORD = this project's own database and user
#
# One-time setup on a new server:
#   docker network create db_net
#
#   docker compose up -d --build
#   docker compose exec app composer install --no-dev --optimize-autoloader
#   docker compose run --rm node sh -c "npm ci && npm run build"
#   docker compose exec app php artisan migrate --force

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: cdk-trenggalek/app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    networks:
      - default
      - db_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: cdk-trenggalek/app
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - default
      - db_net

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8081}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - default

  # One-off tool for building frontend assets: docker compose run --rm node sh -c "npm ci && npm run build"
  node:
    image: node:22-alpine
    working_dir: /var/www
    volumes:
      - ./:/var/www
    profiles:
      - tools

networks:
  # Shared MySQL network, created once with: docker network create db_net
  db_net:
    external: true
