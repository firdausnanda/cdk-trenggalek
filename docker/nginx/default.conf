# Only serve requests that arrive through the public domain (via the HTTPS
# reverse proxy). Hitting the container directly by IP, e.g.
# http://103.183.92.79:8081/, gets redirected to the domain instead.
# The proxy must forward the original Host header (proxy_set_header Host $host)
# or X-Forwarded-Host.
map "$host|$http_x_forwarded_host" $allowed_host {
    default                                        0;
    "~^cdktrenggalek\.dishut\.jatimprov\.go\.id\|"  1;
    "~*\|cdktrenggalek\.dishut\.jatimprov\.go\.id(:\d+)?$"  1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 20M;

    if ($allowed_host = 0) {
        return 301 https://cdktrenggalek.dishut.jatimprov.go.id$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Vite assets have hashed names; uploads use random UUID names.
    location ^~ /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
