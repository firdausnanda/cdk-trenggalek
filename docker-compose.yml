# Docker setup for CDK Trenggalek (replaces Laradock).
#
# Variables are read from the project's .env (Laravel's), e.g. DB_DATABASE and DB_PASSWORD.
# DB_HOST in .env must be "mysql" when running inside Docker.
#
#   docker compose up -d --build
#   docker compose exec app composer install --no-dev --optimize-autoloader
#   docker compose run --rm node sh -c "npm ci && npm run build"
#   docker compose exec app php artisan migrate --force

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: cdk-trenggalek/app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    depends_on:
      - mysql

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    image: cdk-trenggalek/app
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - mysql

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8081}:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      # Defaults to Laradock's data folder so an existing database is reused as-is.
      - ${DOCKER_MYSQL_DATA:-${HOME}/.laradock/data/mysql}:/var/lib/mysql

  # One-off tool for building frontend assets: docker compose run --rm node sh -c "npm ci && npm run build"
  node:
    image: node:22-alpine
    working_dir: /var/www
    volumes:
      - ./:/var/www
    profiles:
      - tools
